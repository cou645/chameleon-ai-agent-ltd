<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta name="robots" content="noindex"/>
<meta name="referrer" content="no-referrer"/>
<title>HMRC authorisation — Chameleon Accounting</title>
<link href="style.css" rel="stylesheet"/>
<style>
  .cb { max-width: 560px; margin: 4rem auto; padding: 2rem 2.2rem;
        background: var(--card-bg); border: 1px solid var(--border);
        border-radius: var(--radius); box-shadow: var(--shadow); text-align: center; }
  .cb h1 { color: var(--brand-text); font-size: 1.4rem; margin-bottom: .6rem; }
  .cb p { color: var(--muted); font-size: .95rem; }
  .code-box { font-family: 'IBM Plex Mono','Courier New',monospace; font-size: 1.05rem;
        word-break: break-all; background: #1a1a2e; color: #c8c8f0;
        border-radius: 10px; padding: 1rem 1.2rem; margin: 1.2rem 0; }
  .cb button { background: var(--brand-text); color: #fff; border: 0; border-radius: 50px;
        padding: .6rem 1.4rem; font-size: .95rem; font-weight: 600; cursor: pointer; }
  .cb button:hover { background: var(--brand-mid); }
  .err { color: #b91c1c; }
  .ok  { color: #15803d; font-size: .85rem; }
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<div class="cb" id="main" role="main">
  <h1>Chameleon Accounting</h1>
  <div id="body"><p>Reading the response from HMRC…</p></div>
</div>
<script>
(function () {
  // Everything taken from the URL is inserted with textContent only — never
  // innerHTML — so a crafted link cannot inject markup or script into this
  // page (the error_description parameter used to be inserted as HTML).
  var q = new URLSearchParams(location.search);
  var code = q.get('code'), state = q.get('state');
  var err = q.get('error'), desc = q.get('error_description');
  var b = document.getElementById('body');
  function el(tag, text, cls) {
    var e = document.createElement(tag);
    if (text) e.textContent = text;
    if (cls) e.className = cls;
    return e;
  }
  b.textContent = '';
  if (err) {
    var p = el('p', null, 'err');
    p.appendChild(el('strong', 'HMRC returned an error: '));
    p.appendChild(document.createTextNode(err + (desc ? ' — ' + desc : '')));
    b.appendChild(p);
    b.appendChild(el('p', 'Close this tab and start the authorisation again.'));
    return;
  }
  if (!code) {
    b.appendChild(el('p', 'No authorisation code in the URL. Open this page only via ' +
      'the HMRC consent flow started by Chameleon Accounting.'));
    return;
  }
  // The software checks the OAuth "state" as well as the code, so what the
  // user copies is this page's full address (it carries both).
  var full = location.href;
  b.appendChild(el('p', 'Authorisation granted. Copy this address back into ' +
    'Chameleon Accounting (it contains the code and the security check value):'));
  var box = el('div', full, 'code-box'); box.id = 'c';
  b.appendChild(box);
  var btn = el('button', 'Copy'); btn.id = 'cp';
  b.appendChild(btn);
  var status = el('p', null, 'ok'); status.id = 's';
  b.appendChild(status);
  if (!state) {
    b.appendChild(el('p', 'This address has no "state" value — the software ' +
      'will refuse it. Start the authorisation again from Chameleon Accounting.', 'err'));
  }
  var hint = el('p', 'In the app, paste it into the HMRC connection box. ' +
    'From the command line, run (keep the quotes):');
  hint.style.marginTop = '1rem';
  b.appendChild(hint);
  b.appendChild(el('code', "chameleon_accounting.py --hmrc-exchange-code '<address>' --hmrc-sandbox"));
  btn.onclick = function () {
    (navigator.clipboard ? navigator.clipboard.writeText(full) : Promise.reject())
      .then(function () { status.textContent = 'Copied.'; })
      .catch(function () { status.textContent = 'Select the address above and copy it manually.'; });
  };
})();
</script>
<footer><p class="ai-notice">Written and translated by AI.</p></footer>
</body>
</html>
